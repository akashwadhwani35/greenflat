name: Ops - Sync a secret into Secret Manager

# Copies one GitHub Actions secret into Google Secret Manager using the same
# Workload Identity the deploy uses. Exists because the local gcloud session on
# the dev Mac cannot create secrets non-interactively. Run it from the Actions
# tab (or `gh workflow run`) with the GitHub secret name and the Secret Manager
# name; the Cloud Run runtime account is granted read access.
on:
  workflow_dispatch:
    inputs:
      github_secret:
        description: 'GitHub secret to copy (must exist in this repo)'
        required: true
        default: 'REVENUECAT_SECRET_KEY'
      gsm_name:
        description: 'Secret Manager secret name'
        required: true
        default: 'revenuecat-secret-key'

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      # Only the secrets this job is meant to copy are exposed here.
      REVENUECAT_SECRET_KEY: ${{ secrets.REVENUECAT_SECRET_KEY }}
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Create or update the secret
        env:
          GITHUB_SECRET: ${{ inputs.github_secret }}
          GSM_NAME: ${{ inputs.gsm_name }}
          PROJECT: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          VALUE="${!GITHUB_SECRET:-}"
          if [ -z "$VALUE" ]; then
            echo "GitHub secret $GITHUB_SECRET is empty or not exposed to this job" >&2
            exit 1
          fi
          if gcloud secrets describe "$GSM_NAME" --project "$PROJECT" >/dev/null 2>&1; then
            printf '%s' "$VALUE" | gcloud secrets versions add "$GSM_NAME" --project "$PROJECT" --data-file=-
            echo "Added a new version to $GSM_NAME"
          else
            printf '%s' "$VALUE" | gcloud secrets create "$GSM_NAME" --project "$PROJECT" --replication-policy automatic --data-file=-
            echo "Created $GSM_NAME"
          fi
          PROJECT_NUMBER=$(gcloud projects describe "$PROJECT" --format='value(projectNumber)')
          RUNTIME_SA=$(gcloud run services describe greenflag-api --region us-central1 --project "$PROJECT" --format='value(spec.template.spec.serviceAccountName)' || true)
          RUNTIME_SA="${RUNTIME_SA:-${PROJECT_NUMBER}-compute@developer.gserviceaccount.com}"
          gcloud secrets add-iam-policy-binding "$GSM_NAME" --project "$PROJECT" \
            --member "serviceAccount:${RUNTIME_SA}" --role roles/secretmanager.secretAccessor >/dev/null
          echo "Granted secretAccessor on $GSM_NAME to $RUNTIME_SA"
