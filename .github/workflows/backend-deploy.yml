name: Backend - Build & Deploy to Cloud Run

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
  # Lets a failed or workflow-only change be re-run without a dummy commit.
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Authorize Docker push
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build Docker image
        run: |
          docker build \
            -t us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/greenflag/greenflag-api:${{ github.sha }} \
            -t us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/greenflag/greenflag-api:latest \
            ./backend

      - name: Push Docker image
        run: |
          docker push us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/greenflag/greenflag-api:${{ github.sha }}
          docker push us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/greenflag/greenflag-api:latest

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: greenflag-api
          region: us-central1
          image: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/greenflag/greenflag-api:${{ github.sha }}
          env_vars: |
            NODE_ENV=production
            OPENAI_MODEL=gpt-4o-mini
            OPENAI_EMBEDDING_MODEL=text-embedding-3-small
            JWT_EXPIRES_IN=7d
            RUN_MIGRATIONS_ON_BOOT=true
            PAYMENTS_ENABLED=false
            FREE_TOKEN_ALLOWANCE=30
            TOKEN_ALLOWANCE_INTERVAL_HOURS=24
            REQUIRE_EXTERNAL_SERVICES=false
          # NOTE: the secrets block below is a literal string passed straight to
          # gcloud, NOT yaml. A "#" line inside it becomes a bogus secret mapping
          # and fails the deploy, so keep commentary out here.
          #
          # Phone verification and cloud media are OFF in production until Twilio
          # and Cloudinary secrets exist in Secret Manager. The
          # REQUIRE_EXTERNAL_SERVICES=false above is what suppresses the startup
          # check that would otherwise catch it. Once the secrets are created, add
          # these lines to the block below and drop that flag:
          #   TWILIO_ACCOUNT_SID=twilio-account-sid:latest
          #   TWILIO_AUTH_TOKEN=twilio-auth-token:latest
          #   TWILIO_FROM_NUMBER=twilio-from-number:latest
          #   CLOUDINARY_CLOUD_NAME=cloudinary-cloud-name:latest
          #   CLOUDINARY_API_KEY=cloudinary-api-key:latest
          #   CLOUDINARY_API_SECRET=cloudinary-api-secret:latest
          secrets: |
            DATABASE_URL=database-url:latest
            JWT_SECRET=jwt-secret:latest
            OPENAI_API_KEY=openai-api-key:latest
            GOOGLE_MAPS_API_KEY=google-maps-api-key:latest
            GOOGLE_OAUTH_CLIENT_IDS=google-oauth-client-ids:latest

      - name: Show deployed URL
        run: echo "Deployed to ${{ steps.deploy.outputs.url }}"
